[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucid"
version = "0.6.0"
description = "Spotlight-style desktop AI assistant with vision, teach, and autonomous control modes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Lucid Contributors" }]
keywords = ["ai", "assistant", "computer-use", "automation", "agent", "spotlight", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "PySide6>=6.6",
    "mss>=9.0.1",
    "pygetwindow>=0.0.9",
    "pywin32>=306; sys_platform == 'win32'",
    "uiautomation>=2.0.18; sys_platform == 'win32'",
    "keyboard>=0.13.5",
    "pyautogui>=0.9.54",
    "pydirectinput>=1.0.4; sys_platform == 'win32'",
    "pynput>=1.7.6",
    "anthropic>=0.40.0",
    "croniter>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "keyring>=24.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "httpx>=0.25",
    "fluent.runtime>=0.4.0",
    "typer>=0.12.5",
]

[project.optional-dependencies]
cli = [
    "claude-agent-sdk>=0.1.0",
]
ocr = [
    "easyocr>=1.7",
]
omniparser = [
    "torch>=2.1",
    "transformers>=4.40",
    "ultralytics>=8.0",
]
browser = [
    "playwright>=1.40",
]
mcp = [
    "mcp>=1.0",
    "anyio>=4.0",
]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.4",
    "pytest-mock>=3.12",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.8",
    "pre-commit>=3.7.1",
]
build = [
    "pyinstaller>=6.3",
]

[project.scripts]
lucid = "lucid.__main__:main"

[project.entry-points."lucid.actions"]
# Built-in actions register themselves when lucid.actions.builtin imports.
# Third-party plugins extend this group; see docs/plugins.md.

[project.entry-points."lucid.llm.providers"]
# Built-in providers register themselves on import. Third-party providers
# extend this group to plug in new backends.

[project.urls]
Homepage = "https://github.com/ertugrulakben/lucid"
Repository = "https://github.com/ertugrulakben/lucid"
Issues = "https://github.com/ertugrulakben/lucid/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lucid"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.codespell]
ignore-words-list = "bu"
skip = "*.ftl"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
